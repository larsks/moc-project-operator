apiVersion: project.massopen.cloud/v1alpha1
kind: Project
metadata:
  labels:
    app.kubernetes.io/name: moc-project-operator
    app.kubernetes.io/managed-by: kustomize
  name: project-sample
spec:
  displayName: "Sample Project"
  members:
    - user1
    - user2
  deleteAction: Preserve
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
  quotas:
    cpu: "4"
    memory: "8Gi"
